# Fly.io config -- ik-ad-generator (PLAN.md Phase 1 Step 14). Scheduled
# batch, not a web service -- separate app from ik-anomaly/sip-pipeline.
#
# Architecture (mirrors /mnt/c/mcp-servers/anomaly-engine/fly.toml exactly):
#   Cloudflare Worker cron (cloudflare-trigger/, 05:30 UTC = 11:00 AM IST,
#   after Performance's own ik-anomaly run at 10:00 AM IST)
#     --> Fly Machines API: start this app's single machine
#     --> entrypoint.sh materializes secrets -> run_daily.sh runs the chain
#     --> machine exits; Fly auto-stops it (billed only for the run's
#         duration, roughly once a day)
#
# Deploy FROM THE MIS REPO ROOT:
#   fly deploy . --config fly.toml --dockerfile fly-deploy/Dockerfile --ha=false
#
# The app must have exactly ONE machine: e820794c74d708, the machine the
# Cloudflare Worker starts (its FLY_MACHINE_ID). --ha=false (2026-10-27)
# stops flyctl from (re)creating the default HA standby -- a second machine
# is never the cron target, only a confusing stopped copy (18514d5c651ee8
# was one). Deploy only while that machine is stopped (the daily run is
# ~11:00-14:30 IST): strategy=immediate below would kill a run in progress.
#
# Weekly campaign-registry refresh (run_daily.sh step 2b): its env knobs
# (REGISTRY_REFRESH_ENABLED / FORCE_REGISTRY_REFRESH / REGISTRY_STALE_DAYS /
# REGISTRY_REFRESH_TIMEOUT_S) default inside run_daily.sh and are NOT set
# here; LinkedIn is included only when the optional LINKEDIN_ENV_B64 secret
# is set (see fly-deploy/entrypoint.sh).

app = 'ik-ad-generator'
primary_region = 'sin'   # same region choice as ik-anomaly/ik-claude-spike (bom had no capacity 2026-06-05)

# No [http_service] -- scheduled batch, not a web service. Runs to
# completion, exits.

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'   # no Chromium/Playwright here (unlike ik-anomaly); Node CLI + Python is comfortable at 1GB

[[restart]]
  policy = "never"    # a failure must NOT auto-restart (would duplicate BQ writes + a Slack digest)

[deploy]
  strategy = "immediate"

[env]
  # Overridable via `fly deploy --env` or `flyctl secrets set` (as a var,
  # not a secret, once a real value exists) -- no live dashboard URL yet
  # per PLAN.md ("merge+deploy decision for dashboard" is still pending).
  MIS_DASHBOARD_URL = "http://localhost:3000/generation"
  # BUG FOUND 2026-07-07: this was never set anywhere (not here, not as a
  # secret), so bq_writer.py's `os.environ.get("DRY_RUN","true")` default
  # silently kept every scheduled run in preview-only mode since deploy --
  # nothing landed live even on a fully successful run. Explicit now.
  DRY_RUN = "false"
  # Copy-path synth ran right at the old hardcoded 600s ceiling on 2026-07-07
  # (85 ad_copy + 16 angles at live registry scale). Raised to 900s for
  # headroom; tunable here without a code change. Paired with a cap on the
  # registered-campaigns digest (CONDUCTOR_MAX_REGISTERED_CAMPAIGNS, default 80)
  # that shrinks the prompt itself.
  # 1200s (was 900): the copy path hit 751s on 2026-07-11 -- 83% of the 900s
  # ceiling -- once LinkedIn InMail/Conversation copy (long bodies) was enabled.
  # Headroom so a heavier LinkedIn day doesn't tip the single copy synth over
  # and fail the day's copy generation. Proper follow-up: cap the copy output
  # (fewer campaigns/rows per run) rather than just raising the ceiling.
  # 1800s (was 1200): the copy synth hit 1211s -> timed out -> fail-fast killed
  # the whole chain (2026-07-14). Raising the ceiling + capping campaigns did NOT
  # converge -- one giant claude -p call for all campaigns exceeded even 1800s
  # three days running. Real fix (2026-07-14, later): the copy path now BATCHES
  # campaigns into small weight-bounded groups (CONDUCTOR_COPY_BATCH_BUDGET, default
  # 20; LinkedIn weighs CONDUCTOR_COPY_WEIGHT_LINKEDIN, default 7) and makes one
  # claude -p call PER batch, each fail-soft. So this 1800s is now a generous
  # PER-BATCH ceiling (a batch is ~<=480s of output) -- no batch comes near it.
  GENERATION_LLM_TIMEOUT_S = "1800"
  # Copy output driver: the brain generates copy per registered campaign. Cap to
  # 50 (was default 80) so the single copy synth stays fast/bounded now that
  # LinkedIn InMail/Conversation bodies are long. Fewer, more-focused campaigns.
  CONDUCTOR_MAX_REGISTERED_CAMPAIGNS = "40"
  # Cap LinkedIn campaigns getting InMail/Conversation copy per run -- their long
  # bodies are what blew the copy synth past the timeout on 2026-07-14. Google RSA
  # is cheap and stays at the cap above; LinkedIn is the heavy, bounded lever.
  CONDUCTOR_MAX_LINKEDIN_CAMPAIGNS = "5"
  # Keyword Planner demand grounding + topic routing + already-running gate
  # (docs/keyword-planner-integration-plan.md). Enabled 2026-07-10 after a live
  # manual verify run confirmed correct enrichment/routing/exclusion on the real
  # account. Auto-pick routes AI keywords -> IK-IN_Search_NB_EdgeUp_Generic_AI_35-54,
  # non-AI -> IK-IN_Search_NB_LevelUp_Generic_Allsale_HI_INDIA (env-pinnable via
  # KWP_EDGEUP_CAMPAIGN / KWP_LEVELUP_CAMPAIGN).
  CONDUCTOR_ENABLE_KEYWORD_PLANNER = "true"
  CONDUCTOR_ENABLE_TOPIC_ROUTING = "true"
  CONDUCTOR_ENABLE_RUNNING_KEYWORD_GATE = "true"
  # LinkedIn InMail / Conversation ad copy (docs/linkedin-inmail-copy-plan.md).
  # Enabled 2026-07-10 after a flag-on dry-run confirmed the generated copy
  # reproduces the stored templates faithfully. With it off the copy path emits
  # legacy Sponsored Content for LinkedIn.
  CONDUCTOR_ENABLE_LINKEDIN_INMAIL = "true"
